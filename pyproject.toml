[project]
name = "phoreal"
version = "4.0.0.dev0"
description = "ICESat-2 (ATL03/ATL08/ATL24) and airborne lidar comparison tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "rasterio",
    "h5py",
    "laspy[lazrs]",
    "scipy",
    "joblib",
    "geopy",
    "matplotlib",
    "tqdm",
    "PyYAML",
    "pyarrow",
]

[project.optional-dependencies]
# Used by projects/ and examples/, not by the library itself
projects = ["scikit-learn", "fiona"]
planet = ["requests", "opencv-python", "Pillow"]
geolocation = ["earthaccess<0.19", "icepyx"]  # icepyx 2.0 calls concept_id(), a property since earthaccess 0.19
notebooks = ["jupyter", "ipywidgets"]

[dependency-groups]
dev = ["pytest", "nbstripout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoreal"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
